ive:enabled{transform:translateY(1px)}button.play:disabled{color:var(--line-hi);cursor:default}button.play:focus-visible{outline:2px solid var(--amber);outline-offset:2px}button.play.on{background:var(--sunk);color:var(--amber)}.knobs{display:flex;flex-wrap:wrap;gap:5px 12px;margin:0;padding:0;list-style:none;font-size:12px;color:var(--dim)}.knobs li{white-space:nowrap}.knobs b{color:var(--teal);font-weight:400}.knobs.empty{display:none}footer{border-top:1px solid var(--line);padding-top:16px;font-size:12px;color:var(--dim);display:flex;flex-direction:column;gap:6px}footer a{color:var(--amber)}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
