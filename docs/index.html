const{ChipTuneSound}=MMSXX.sound,$=e=>document.querySelector(e),el=(e,t,n)=>{const a=document.createElement(e);return t&&(a.className=t),n!=null&&(a.textContent=n),a};addEventListener("error",e=>{const t=$("#oops");t.style.display="block",t.textContent="Something broke: "+(e.message||e)});const V={engine:2},DOC=[{h:{en:"What it reads",ja:"テキストの再生"}},{syn:{ja:"カナで入力",en:"Write in kana"},kind:"text",ja:"しゃべらせたいテキストの指定は、カタカナか平仮名で書きます。漢字はうけつけません。",en:"Katakana or hiragana only. Kanji and English will not be read.",say:"ハロー ハロー。ワタシワ レトロトークエンジン デス。"},{syn:{ja:"数字の扱い",en:"How numbers are read"},kind:"text",ja:"数字は入力できますが、読み方が限定されます。`123` は「イチ ニ サン」です。「ヒャク ニジュウ サン」とは読まれません。",en:'Digits can be typed, but their readings are fixed. 123 is spoken "ichi ni san", never "hyaku nijuu san".',say:"バンゴウハ 0 3 5 8 デス。"},{syn:{ja:"英字の扱い",en:"How letters are read"},kind:"text",ja:"英字は入力できますが、1 字ずつ読まれます。単語としては扱われません。`CPU` は「シーピーユー」、`RAM` は「ラム」ではなく「アールエーエム」です。",en:'Latin letters are spelled out one at a time, using their Japanese names. CPU comes out as "shii pii yuu", and RAM as "aa ee emu" rather than as a word.',say:"CPU ト RAM ヲ カクニン シマス。"},{syn:{ja:'"ー 〜 …"',en:"Long vowels and trailing off"},kind:"text",ja:"`ー` と `〜` は音を伸ばします。`〜` は語尾が揺れます。`…` または `...`(ピリオド 3 つ)は、弱い発音で間が空きます。",en:"The long mark ー and the wave mark ～ both hold a vowel, and ～ wavers as it fades. The mark … or three periods fades the line out and leaves a gap.",say:"キャー。ヤッター。オカ〜サ〜ン。 ウン、ナンデモナイ…"},{syn:{ja:'"空白 ＿ 、 。！？"',en:"Pauses and intonation"},kind:"text",ja:"空白や読点やアンダースコアを入力すると、音声の合間が開きます。(アンダースコアはスペースを見やすくするために使います。)`！` と `？` ではイントネーションが変わります。`！？` は 2 文字でひとつの記号として扱い、`？` より大きく上がります。まとめてイントネーションを変えたいときは、`（ ）` で囲ってください。空白と `！` と `？` と `（ ）` は、全角でも半角でも受け付けます。",en:"A space, a comma 、 or an underscore opens a gap in the speech. (The underscore is there when you want the gaps to be visible.) The marks 。！？ change how the line ends, and ！？ counts as a single mark that lifts higher than ？ alone. To shift a whole phrase, wrap it in （ ）. Spaces, ！ ？ and （ ） are accepted full-width or half-width.",say:"アノネ、キイテ。 ソウナノ？ （ホントニ）！？ クギレバ モドリマス。ホラ＿モドリマシタ！"},{syn:{ja:"括弧の扱い",en:"How brackets work"},kind:"text",ja:"括弧は、本文と歌とで扱いが変わります。本文では、抑揚をまとめてコントロールするのに使います。歌では、1 つの音符に複数の文字を対応させるときに使います。",en:"Brackets do two different jobs. In a spoken line they shift the intonation of everything inside. In a song they put several kana on one note.",say:"ソウナンダ！（ソウナンダ）！"},{syn:{ja:'"＞ ＜"',en:"Raising and lowering"},kind:"text",ja:"音の高さを上下にコントロールします。句読点で元に戻ります。半角、全角どちらでも受け付けます。",en:"The marks ＞ and ＜ raise and lower the pitch, and it returns to normal at the next 、 or 。 Full-width and half-width both work.",say:"コレガ フツウ。コ＞レ＞ワ＞ ア＞ガ＞リ＞マ＞ス。コ＜レ＜ワ＜ サ＜ガ＜リ＜マ＜ス。"},{h:{en:"Special syntax",ja:"特殊な文法"}},{syn:"@p<Hz>",kind:"own",ja:"声の高さをヘルツで指定します。デフォルト値は 280 です。",en:"Sets the pitch in hertz. The default is 280.",say:"ワタシデス。@p180 イエ、ワタシデス。"},{syn:"@s<%>",kind:"own",ja:"話す速度をコントロールします。100 が等倍で、150 は 1.5 倍になります。",en:"Controls the speaking rate. 100 is normal, 150 is one and a half times as fast.",say:"ニゲロー。@s150 ハヤク ハヤク。@s70 マニアワナイ。"},{syn:"@v<0-15>",kind:"own",ja:"音量を 0-15 の 16 段階で指定します。デフォルト値は 10 です。",en:"Sets the volume in sixteen steps, 0 to 15. The default is 10.",say:"キイテクダサイ。@v6 ダレニモ イワナイデ。@v15 タノミマシタヨ。"},{h:{en:"Controlling the accent",ja:"アクセントの制御"},tune:!0},{syn:{ja:"基本的なアクセント制御",en:"Accent basics"},kind:"text",ja:"声の高さは、最初に少し上がってからだんだん下がります(JavaScript パラメータで挙動は変えられます)。文に句読点が入ると抑揚はリセットされます。`！` と `？` と `！？` は文末の音程や音長を変化させます。カッコ `（ ）` で囲んだ範囲は抑揚が抑えられ、後ろに `！` や `？` がついた場合はかっこのなかみがまとめて影響を受けます。`＞` `＜` は直接音程の高さを上下にコントロールできます。",en:"The pitch lifts a little at the start of a line and then falls away; JavaScript options change that shape. Each 、 or 。 starts it over. ！ ？ and ！？ each change the pitch and the length at the end of a line. Inside （ ） the pitch is held flat, and a following ！ or ？ acts on the whole bracketed part at once. ＞ and ＜ move the pitch up and down directly.",say:"コンニチワ。ゲンキ？ （スゴク）ゲンキ！ ソ＞レ＞ワ＞ ヨカッタ。"},{syn:{ja:"AquesTalk風の制御",en:"AquesTalk-style accent marks"},kind:"text",ja:"AquesTalk風のアクセント制御が行えます。`'` はアクセント指定で、その音の直後にアクセントが下がります。`/` はアクセントの区切り、`+` は前の区画にアクセントを続けます。AquesTalk では `_` が文末で無声音(母音なし)を作る記号として扱われますが、そもそも RetroTalk では文末がデフォルトで無声音になります。`_` は無音を再生の意味になります。逆に母音を有効にしたい場合は `^` を指定します。(`^` は RetroTalk 専用の制御文字です。)",en:"These are AquesTalk-style accent marks. An apostrophe sets the accent, and the pitch drops right after that mora. A slash divides accent phrases and a plus carries the accent on from the phrase before. An underscore devoices the end of a phrase in AquesTalk; RetroTalk does that by rule already, so here it is a silent gap instead. To keep a vowel the rule would drop, write a caret — that one is RetroTalk's own.",tryBox:{rows:2,noJs:!0,text:"コレガ ア’クセント/ノ イチ +デス。ソウナンデ^ス。ユック’リシテイッテネ！"}},{syn:{ja:"アクセントの移動幅指定",en:"How far one mark moves"},kind:"js",knobs:["tuneStep"],ja:"`＞` `＜` 1 つで動く音程の量を半音単位で指定できます。デフォルトは 1 です。",en:"Sets how far one ＞ or ＜ moves the pitch, in semitones. The default is 1.",say:"ソレ、ド＞ン＞ド＞ン タカク ナリマス。＜＜＜＜モドッタ。 ワ＞＞ア＜＜ア＞＞ア＜＜イ",opts:{tuneStep:4}},{h:{en:"Watch out for these",ja:"注意する記述"}},{syn:{ja:"単位のある数字",en:"Numbers with units"},kind:"gone",ja:"数字の読みは自動で調整されません。`4ガツ 4カ` は「ヨンガツ ヨンカ」になります。「シガツ ヨッカ」とカナで記述してください。",en:'Readings are not adjusted for context. 4ガツ 4カ comes out as "yon gatsu yon ka". Write it in kana as シガツ ヨッカ.',say:"キョウワ 4ガツ 4カ デス。ジャナイ、シガツヨッカデス。"},{syn:{ja:"漢字と半角カナ",en:"Kanji and half-width kana"},kind:"gone",ja:"漢字と半角カナは、どちらも無視されます。平仮名は発音されます。",en:"Kanji and half-width kana are both ignored. Hiragana is spoken.",say:"漢字わｶﾝｼﾞのカンジ。"},{syn:{ja:"は・へ・を 他",en:"The particles ハ ヘ ヲ"},kind:"gone",ja:"`ハ` と `ヘ` は、いつでも HA と HE として発音されます。`ワタシハユメヲカナエルタビヘデル` は `ワタシワユメヲカナエルタビエデル` と書きます。`ヲ` はそのままでよいです。`ゐ` `ヰ` は「イ」、`ゑ` `ヱ` は「エ」と発音されます。",en:'ハ and ヘ are always pronounced "ha" and "he", so write ワ and エ where a particle is meant. ヲ can be left as it is. The old kana ゐ ヰ are pronounced "i", and ゑ ヱ "e".',say:"ワタシハ ユメヲカナエル タビヘデル。モトイ、ワタシワ タビエ イキタイ。"},{h:{en:"Voice settings (JS)",ja:"声のカスタマイズ(JS)"},tune:!0},{syn:{ja:"ピッチとスピード",en:"Pitch and speed"},kind:"own",knobs:["pitch","speed"],ja:"`pitch` は声の高さ、`speed` は話す速さを調整する JavaScript パラメータです。文の頭に `@p` `@s` を書いたのと同じです。文の途中に書いた `@p` `@s` のほうが優先されます。",en:"pitch sets the voice height and speed the rate, both passed in from JavaScript. They amount to writing @p or @s at the head of the line, and marks written inside the line take over from there.",say:"コエノ タカサダケヲ カエマシタ。",opts:{pitch:165},says:[{say:"ハヤサダケヲ カエマシタ。",opts:{speed:1.5}}]},{syn:{ja:"ピッチ調整",en:"Pitch shift"},kind:"own",knobs:["pitchShift"],ja:"文章全体の音の高さを、半音単位で上げ下げします。`pitch` は話し始めの高さの指定で、`@p` で音程指定があると無効になりますが、`pitchShift` は `@p` の音程指定ごと調整できます。",en:"Moves the pitch of the whole line up or down in semitones. pitch only sets where the line starts, and a written @p overrides it; pitchShift moves those written values too.",say:"ヒクイ コエ。@p320 タカイ コエ。",opts:{pitch:160,pitchShift:0}},{syn:{ja:"音量とスピードの調整",en:"Volume and speed shift"},kind:"own",knobs:["volumeShift","speedShift"],ja:"`volumeShift` が音量の調整、`speedShift` がスピードの調整です。`pitchShift` と同じく文章全体をまとめて調整できます。",en:"volumeShift moves the level and speedShift the rate. Like pitchShift, they move the whole line at once, marks and all.",say:"キイテクダサイ。@v6 ダレニモ イワナイデ。@s150 イソギマス。",opts:{pitch:250,volumeShift:0,speedShift:1}},{syn:{ja:"声の太さの指定",en:"Formant shift"},kind:"own",knobs:["formantShift"],ja:"`formantShift` は声色の調整です。音程はかわりませんが、太い声〜細い声で変化します。男性は −4、女性は +2、子どもは +5 程度が一応の目安です。",en:"formantShift changes the timbre. The pitch stays where it is; what moves is how thick or thin the voice sounds. Around −4 for a man, +2 for a woman, +5 for a child, as a rough guide.",say:"オナジ タカサデモ ベツジンニ ナリマス。",opts:{pitch:250,formantShift:5}},{syn:{ja:"かすれ声とだみ声",en:"Breath and jitter"},kind:"own",knobs:["breath","jitter"],ja:"`breath` は声に息を混ぜます。上げるとかすれ声、ささやき声に近づきます。`jitter` は声の高さをランダムに揺らします。上げるとがらがら声になります。どちらも 少しの値で声が大きく変化します。",en:"breath mixes air into the voice; raise it for a rasp or a whisper. jitter jogs the pitch at random; raise it for a growl. A little of either goes a long way.",say:"ノドガ カレマシタ。オアアアアアアアア〜。",opts:{pitch:150,formantShift:-4,breath:.35,jitter:.3}},{syn:{ja:"抑揚のコントロール",en:"Rise and fall"},kind:"own",knobs:["fall","rise"],ja:"文章を話している間、音程は最初上昇してから下降します。この上下動の大きさをコントロールするパラメータが `rise` と `fall` です。`rise` は最初の上昇具合、`fall` はその後の下降具合です。両方 0 にすると抑揚のない棒読みで音声がながれます。両パラメータとも歌唱モードでは値が無視されます。",en:"While a line is spoken the pitch climbs at first and then falls away. rise and fall set how far it moves: rise is the climb, fall the drop that follows. Set both to 0 and the line is read flat. Both are ignored while singing.",say:"ワレワレワ ウチュウジンデアル キエテ ・ コシ ・ キレキレテ",opts:{pitch:300,fall:0,rise:0}},{syn:{ja:"声のデジタルぽさ",en:"Digital roughness"},kind:"own",knobs:["interp","frame"],ja:"`frame` の値を上げていくとデジタルぽさがましたような粗い音声になります。`interp` を ON にするとその粗さを補完して滑らかな声になります(同時に聞き取りづらくなります)。`interp` が OFF で `frame` の値が小さい時とはまた違った味わいが出せます。",en:"Raise frame and the voice turns coarse, as if the machine were slower. Turn interp on and those gaps are filled in, smoothing the voice out and making it harder to follow at the same time. That gives a different flavour again from leaving interp off with a small frame.",say:"スキスキスー_スキスー_スキスー",opts:{pitch:220,interp:!1,frame:.03}},{syn:{ja:"音質の粗さ",en:"Bit depth"},kind:"own",knobs:["bits"],ja:"音質を設定します。小さくするほどざらつきますが、`0` はざらつきなしの意味で最も綺麗な音になります。",en:"Sets the grain of the sound. The lower it is the grittier it gets, except 0, which means no grain at all and gives the cleanest sound.",say:"ザラザラノ コエ デス。",opts:{pitch:220,bits:4}},{syn:{ja:"金属質な声",en:"Ring modulation"},kind:"own",knobs:["ring"],ja:"`ring` パラメータは音声に別の音を掛け合わせる度合いです。値をあげていくと、金属的な音になります。20〜80Hz あたりまでは言葉が聞き取れます。",en:"ring is how much of another tone is multiplied into the voice. Raise it and the sound turns metallic. Words still carry somewhere between 20 and 80Hz.",say:"ハッ＿ハッ＿ハッ＿ハ＿＿オ＿マエ＿ワヨ＿ワイ＿＿ ハッ＿ハッ＿ハッ＿ハ。",opts:{pitch:200,ring:55}},{h:{en:"Singing (JS)",ja:"歌わせる(JS)"}},{syn:{ja:"歌わせる",en:"Singing"},kind:"own",knobs:["sing"],ja:"指定した文章に音程をつけて歌わせる事ができます。あまりリズム感はよくありません。音程は別途 MML という記法を使って `sing` パラメータに指定します。文章内にある音程や速度の指定は MML 指定で上書きされます。歌にする際は、特別なテキスト記述ルールがいくつか追加でされます。`（ ）` でくくった内部に書いた文章は 1 音で歌われます。`ー` や `〜` など音を伸ばすテキストは無視されます(`ッ` は無音として残ります)。",en:"A line can be sung to a tune. The rhythm is not its strong point. The tune is written separately in sing, using MML, and it overrides any pitch or speed written in the line itself. Singing also adds a few rules to the text: whatever sits inside （ ） is sung on one note, and marks that hold a vowel, ー and ～, are ignored (ッ still leaves its silence).",say:"サクラサクラノヤマモサトオモ ミワタスカギイリ",opts:{sing:"t120 v9 q7 l4 o3 g g a2 g g a2 g a b- a g a8 g8 e-2 d o2 b- o3 d e- d d8 o2 b-8 a2"}},{syn:{ja:"ハモって歌わせる",en:"Singing in harmony"},kind:"own",ja:"複数人同時に歌わせる事ができます。JavaScript コードは実装の都合で少し特殊になります。",en:"Several voices can sing at once. The JavaScript for it looks a little unusual, for reasons of how it is built.",say:"サクラサクラノヤマモサトオモ ミワタスカギイリ",opts:{sing:"t120 v9 q7 l4 o3 g g a2 g g a2 g a b- a g a8 g8 e-2 d o2 b- o3 d e- d d8 o2 b-8 a2"},opts2:{sing:"t120 v7 q7 l4 o4 d d e2 d d e2 d e f e d e8 d8 o3 b-2 a f a b- a a8 f8 e2"}},{h:{en:"Small MML for singing",ja:"歌唱用簡易MML"}},{syn:{ja:"歌唱用MMLの書き方",en:"The MML used for singing"},kind:"own",ja:"`sing` パラメータに指定する MML 形式の楽曲データです。`cdefgab` が音の高さ、`#` `+` で半音上げ、`-` で半音下げます。`o` でオクターブ指定、`>` `<` でオクターブを上下します。数字は音長で、`.` をつけると 1.5 倍の長さになります。`r` は休符です。休符は発生する言葉とリンクせず、無音時間の指定となります。その他 `l` `t` `&` `v` `q` などが使えるので、一般の MML 記法の解説を参照してください。",en:"The tune passed to sing, written as MML. cdefgab are the notes, # or + raises a semitone and - lowers one. o sets the octave and > < move it. A number is the length, and a dot makes it half again as long. r is a rest: it takes no kana, only silence. l, t, &, v and q work as well — any guide to MML covers them.",say:"かえるのうたが きこえてくるよ (クヮ)(クヮ)(クヮ)(クヮ) ケケケケケケケケ (クヮ)(クヮ)(クヮ)",opts:{sing:"t120 v12 q7 l4 o3 c d e f e d c2 e f g a g f e2 c r c r c r c r c8 c8 d8 d8 e8 e8 f8 f8 e d c4"}},{h:{en:"Delivery settings (JS)",ja:"話し方・歌い方の調整(JS)"}},{syn:"style: 'flat'",kind:"own",ja:"`style` パラメータで発声の仕方を指定できます。`flat` はデフォルトの値で、抑揚のないしゃべり方をします。このまま歌わせるとややうるさいので、別のスタイル指定をお勧めします。",en:"style sets how each note is voiced. flat is the default and speaks without any shaping. Sung as it is, it comes out a little harsh, so one of the other styles is worth trying.",say:"モウカリマッカ？ ボチボチデンナーー。",opts:{pitch:250,style:"flat"}},{syn:"style: 'adsr'",kind:"own",ja:"`adsr` を指定すると、音量に楽器のような抑揚がつくようになり、唄として聞き取りやすくなります。歌唱向けで、通常の音声に指定すると聞き取りづらくなります。",en:"With adsr each note swells and fades like an instrument, which makes a sung line easier to follow. It is meant for singing; on ordinary speech it gets harder to make out.",say:"サイタサイタチューリップノハナガ",opts:{sing:"t120 v9 l4 o3 c d e2 c d e2 g e d c d e d2",style:"adsr"}},{syn:"style: 'vibrato'",kind:"own",ja:"`adsr` と出だしは同じですが、長く伸びる音符でビブラートがかかるようになります。",en:"It starts out the same as adsr, but a note held long enough picks up a vibrato.",say:"サイタサイタチューリップノハナガ",opts:{sing:"t120 v9 l4 o3 c d e2 c d e2 g e d c d e d2",style:"vibrato"}},{h:{en:"Beyond this page",ja:"その他 / FAQ"}},{syn:"漢字をよませたい",kind:"gone",ja:"このツールでは漢字をかなに変換することはできません。自力でがんばるか、外部サービスや API を使って変換すると良いです。VOICEVOX(ずんだもん他の声を簡単に扱う事ができるフリーソフト)を使っているなら、そちらで漢字をかなとして理解させることができ、さらにそこからテキストデータを書き出したり、VOICEVOX プロジェクトファイルを直接このツールに読み込ませる事が可能です。後述の VOICEVOX 連携を参照してください。",en:"This tool cannot turn kanji into kana. Do it by hand, or use an outside service or API. If you already use VOICEVOX (free software for the Zundamon voices and others), it reads kanji for you: you can copy the kana out of it, or hand its project file straight to this tool. See the VOICEVOX section further down."},{syn:{ja:"自作コンテンツ・ゲームで使いたい",en:"Using it in your own game or content"},kind:"gone",ja:"可能です。エンジンは自由に使う事ができます。ページで配布している ZIP ファイルを解凍して、中にあるインストラクションにしたがってください。エンジン単体での再配布は禁止しています。コンテンツの構成ファイルとして含めて配布する事は構いません。",en:"You can. The engine is yours to use. Unzip the file offered on this page and follow the instructions inside. Redistributing the engine on its own is not allowed; shipping it as part of your own work is fine."},{syn:{ja:"動画コンテンツでボイスを使いたい",en:"Using the voice in a video"},kind:"gone",ja:"可能です。書き出した音声データの利用に制限はありません。このページで WAV を書き出して使うのが手っ取り早いですが、プログラムを書けばセリフデータから一括でバッチ書き出しなどもできるでしょう。WAV 書き出しには `renderTalk` 命令が使えます。",en:"You can. There are no strings on the audio you export. Saving a WAV from this page is the quickest route; with a little code you could batch the whole script out at once. renderTalk gives you the waveform to write."},{syn:{ja:"再生前の遅延を無くしたい",en:"Removing the delay before it plays"},kind:"js",ja:"`voice.talk` 命令を使っての音声再生は便利ですが、再生に若干の遅延が発生します。内部で構文の解釈と波形データの作成をしているからです。波形データの作成までを先にすませておくことで、遅延のない再生や同じ音声を再生する際の処理の無駄をなくすことができます。",en:"voice.talk is the convenient way to play a line, but it starts with a slight delay: the text is parsed and the waveform built inside that call. Do the building ahead of time and playback starts without it, and replaying the same line costs nothing.",js:`// 先に登録して、波形データまで作っておきます
voice.defineTalk('hello', 'コンニチワ');
