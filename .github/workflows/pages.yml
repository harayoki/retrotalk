name: Pages

# Rebuilds docs/ on develop, so the published pages cannot fall behind src/.
# The result is committed back to develop; merging develop into main is what
# puts it on the site, and that stays a manual step.
#
# Run by hand only. Building on every push would spend the free Actions
# minutes on commits that do not change the pages.
#
# GitHub Pages itself is served from main /docs by GitHub's own
# pages-build-deployment workflow. Nothing here touches main.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # install, not ci: no package-lock.json is committed
      - run: npm install --no-audit --no-fund
      - run: npm run docs
      - run: npm run site
      - run: node check-site.mjs
      - name: Commit docs/
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs
          git diff --cached --quiet && echo 'docs/ is unchanged' && exit 0
          git commit -m 'Rebuild the pages'
          git push
